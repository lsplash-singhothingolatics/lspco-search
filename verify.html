<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enter your code — LSPSO</title>
<meta name="theme-color" content="#f6f5f2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Manrope:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="home">
  <div class="home-inner auth-inner">

    <a class="wordmark auth-mark" href="/">LSPSO<span class="dot">.</span></a>
    <h1 class="auth-title">Check your inbox</h1>
    <span class="label">Code sent to {{ email }}</span>

    {% with messages = get_flashed_messages() %}
      {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
    {% endwith %}

    <div class="auth-card">
      <form action="{{ url_for('auth.verify') }}" method="post" class="email-form">
        <label class="field-label" for="code">6-digit code</label>
        <input class="otp" type="text" id="code" name="code" inputmode="numeric"
               pattern="[0-9]*" maxlength="6" placeholder="000000"
               autocomplete="one-time-code" required autofocus>
        <button type="submit" class="primary">Sign in</button>
      </form>

      <form action="{{ url_for('auth.resend') }}" method="post">
        <button type="submit" class="ghost">Send a new code</button>
      </form>

      <p class="fine">The code expires in 10 minutes.</p>
    </div>

    <p class="hint"><a href="{{ url_for('auth.login') }}">← Use a different address</a></p>
  </div>
</main>
<script>
  const box = document.getElementById('code');
  box.addEventListener('input', () => {
    box.value = box.value.replace(/\D/g, '');
    if (box.value.length === 6) box.form.submit();
  });
</script>
</body>
</html>
