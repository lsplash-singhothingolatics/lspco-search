<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your account — LSPSO</title>
<meta name="theme-color" content="#f6f5f2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Manrope:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="home">
  <div class="home-inner auth-inner">

    <a class="wordmark auth-mark" href="/">LSPSO<span class="dot">.</span></a>
    <h1 class="auth-title">Your account</h1>

    <div class="auth-card account">
      {% if user.avatar %}
        <img class="avatar-lg" src="{{ user.avatar }}" alt="">
      {% else %}
        <div class="avatar-lg initial">{{ (user.name or user.email)[0]|upper }}</div>
      {% endif %}

      <div class="account-name">{{ user.name or user.email.split('@')[0] }}</div>
      <div class="account-email">{{ user.email }}</div>
      <span class="label">Signed in with {{ user.provider }}</span>

      <form action="{{ url_for('auth.logout') }}" method="post" style="margin-top:1.75rem">
        <button type="submit" class="ghost">Sign out</button>
      </form>
    </div>

    <p class="hint"><a href="/">← Back to search</a></p>
  </div>
</main>
</body>
</html>
