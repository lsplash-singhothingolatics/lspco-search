<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LSPSO — search anything</title>
<meta name="description" content="LSPSO is a calm, fast search engine. Search the web, ask a question, or search inside one website.">
<meta name="theme-color" content="#f6f5f2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Manrope:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="home">
  <div class="home-inner">

    <h1 class="wordmark home-mark">LSPSO<span class="dot">.</span></h1>
    <span class="label">Ask a question &nbsp;·&nbsp; or open a website</span>

    <form action="/search" method="get" autocomplete="off">
      <input type="hidden" name="mode" id="mode" value="web">

      <div class="lens">
        <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path>
        </svg>
        <input type="text" name="q" id="q" placeholder="Search anything" autofocus>
        <button type="submit" class="go">Search</button>
      </div>

      <div class="controls">
        <button type="button" class="mode" data-mode="web" aria-pressed="true">Web</button>
        <button type="button" class="mode" data-mode="ask" aria-pressed="false">Ask a question</button>
      </div>

      <div class="scope">
        <label for="site">Only this site</label>
        <input type="text" name="site" id="site" placeholder="wikipedia.org — optional">
      </div>
    </form>

    <p class="hint">
      Try <b>who invented the radio</b>, or type <b>nasa.gov</b> to open a site directly.
    </p>

  </div>
</main>

<script>
  const modeField = document.getElementById('mode');
  document.querySelectorAll('.mode').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.mode').forEach(b => b.setAttribute('aria-pressed', 'false'));
      btn.setAttribute('aria-pressed', 'true');
      modeField.value = btn.dataset.mode;
      document.getElementById('q').focus();
    });
  });
</script>
</body>
</html>
